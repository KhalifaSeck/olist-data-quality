version: 2

models:
  - name: stg_orders
    description: "Commandes nettoyées depuis raw.orders"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              values: ["delivered", "shipped", "canceled", "unavailable",
                       "invoiced", "processing", "created", "approved"]

  - name: stg_order_items
    description: "Items de commande nettoyés"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_customers
    description: "Clients nettoyés"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Produits nettoyés"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_marketing_leads
    description: "Leads marketing qualifiés"
    columns:
      - name: lead_id
        tests:
          - not_null
          - unique
  - name: stg_sellers
    description: "Vendeurs nettoyés"
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique

  - name: stg_order_payments
    description: "Paiements nettoyés"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: stg_order_reviews
    description: "Avis clients nettoyés"
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null

  - name: stg_geolocation
    description: "Géolocalisation nettoyée"
    columns:
      - name: zip_code
        tests:
          - not_null

  - name: stg_closed_deals
    description: "Deals conclus nettoyés"
    columns:
      - name: lead_id
        tests:
          - not_null

  - name: stg_category_translation
    description: "Traduction des catégories"
    columns:
      - name: category_name_portuguese
        tests:
          - not_null