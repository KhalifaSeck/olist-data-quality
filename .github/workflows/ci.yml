name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 ingestion/ monitoring/ alerting/ --max-line-length=100 --ignore=E501,W503

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: olist
          DB_USER: olist_user
          DB_PASSWORD: olist_pass
          DRY_RUN: "true"